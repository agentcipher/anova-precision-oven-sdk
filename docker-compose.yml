services:
  anova-sdk:
    build:
      context: .
      dockerfile: Dockerfile
    
    # Keep container running with stdin open and tty allocated
    stdin_open: true
    tty: true
    
    environment:
      - ANOVA_ENV=${ANOVA_ENV:-development}
      - ANOVA_TOKEN=${ANOVA_TOKEN}
      - PYTHONUNBUFFERED=1
    
    volumes:
      # Mount entire project for live editing
      - .:/app